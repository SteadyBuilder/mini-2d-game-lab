<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#07090e" />
    <title>Mini 2D Game Lab - Mobile First Prototyping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #07090e;
        --bg-surface: rgba(15, 23, 42, 0.85);
        --bg-surface-hover: rgba(30, 41, 59, 0.95);
        --border-color: rgba(255, 255, 255, 0.09);
        --border-glow: rgba(0, 240, 255, 0.4);
        --accent-cyan: #00f0ff;
        --accent-pink: #ff007f;
        --accent-purple: #a855f7;
        --accent-yellow: #ffe600;
        --accent-green: #00ff88;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-main);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--text-primary);
        touch-action: manipulation;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 15, 25, 0.5);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 240, 255, 0.5);
      }

      /* Background Canvas Particles */
      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        opacity: 0.6;
      }

      /* Main Screen Wrapper: Mobile viewport centering on desktop */
      #app-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
      }

      /* Game Container */
      #game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
        background: #000;
      }

      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      /* In-Game Top Navigation Bar (Mobile Thumb-Friendly) */
      #game-navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(52px + var(--safe-top));
        padding-top: var(--safe-top);
        background: rgba(7, 9, 14, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-left: 14px;
        padding-right: 14px;
        z-index: 100;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
      }

      #game-navbar.active {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .nav-left, .nav-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-hub-return {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        min-height: 38px;
      }
      .btn-hub-return:active {
        background: rgba(0, 240, 255, 0.25);
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
        transform: scale(0.97);
      }

      .nav-game-title {
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 160px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .nav-badge {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 5px;
        text-transform: uppercase;
        font-family: 'Fira Code', monospace;
      }

      .nav-icon-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s ease;
      }
      .nav-icon-btn:active {
        color: #fff;
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.4);
        transform: scale(0.95);
      }

      /* In-Game Bottom Quick Hint */
      #game-bottom-hint {
        position: fixed;
        bottom: calc(14px + var(--safe-bottom));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(7, 9, 14, 0.88);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 6px 14px;
        color: var(--text-secondary);
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 100;
        pointer-events: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        transition: opacity 0.3s ease;
        max-width: 92%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ================= HUB / LAUNCHER UI OVERLAY ================= */
      #hub-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 50;
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at 50% 0%, #151d30 0%, #07090e 75%);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        opacity: 1;
        transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1), transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #hub-overlay.hidden {
        opacity: 0;
        pointer-events: none;
        transform: scale(1.02);
      }

      /* Hub Header */
      .hub-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(7, 9, 14, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border-color);
        padding: calc(12px + var(--safe-top)) 16px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
      }

      .brand-title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.3px;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .brand-version {
        font-size: 9px;
        font-weight: 700;
        background: rgba(0, 240, 255, 0.15);
        color: var(--accent-cyan);
        border: 1px solid rgba(0, 240, 255, 0.3);
        padding: 2px 5px;
        border-radius: 4px;
        font-family: 'Fira Code', monospace;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .stats-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
        padding: 5px 10px;
        border-radius: 16px;
      }
      .stats-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent-green);
        box-shadow: 0 0 8px var(--accent-green);
      }

      /* Hub Hero Section (Mobile Optimized) */
      .hub-hero {
        padding: 20px 16px 12px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
      }

      .hero-tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--accent-cyan);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        font-family: 'Fira Code', monospace;
        margin-bottom: 6px;
      }

      .hero-title {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.6px;
        line-height: 1.25;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .hero-desc {
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.55;
      }

      /* Filter & Search Bar */
      .hub-controls {
        max-width: 900px;
        margin: 8px auto;
        padding: 0 16px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .category-pills {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding: 4px 0 8px;
        scrollbar-width: none;
      }
      .category-pills::-webkit-scrollbar {
        display: none;
      }

      .category-pill {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        padding: 7px 14px;
        border-radius: 18px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .category-pill:active {
        transform: scale(0.96);
      }
      .category-pill.active {
        background: var(--accent-cyan);
        border-color: var(--accent-cyan);
        color: #07090e;
        box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
      }

      .search-box {
        position: relative;
        width: 100%;
      }

      .search-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 9px 12px 9px 36px;
        color: #fff;
        font-size: 13px;
        outline: none;
        transition: all 0.2s ease;
      }
      .search-input:focus {
        border-color: var(--accent-cyan);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      }
      .search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 13px;
        color: var(--text-muted);
        pointer-events: none;
      }

      /* Projects Grid (Mobile-First single or 2-column) */
      .projects-grid {
        max-width: 900px;
        margin: 12px auto calc(40px + var(--safe-bottom));
        padding: 0 16px;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      @media (min-width: 640px) {
        .projects-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 1024px) {
        .projects-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* Project Card */
      .project-card {
        background: var(--bg-surface);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        position: relative;
        cursor: pointer;
      }

      .project-card:active {
        transform: scale(0.98);
        border-color: var(--card-accent, var(--accent-cyan));
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 18px var(--card-glow, rgba(0, 240, 255, 0.25));
      }

      .card-banner {
        height: 110px;
        position: relative;
        background: linear-gradient(135deg, rgba(20, 27, 45, 0.9), rgba(10, 15, 25, 0.95));
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid var(--border-color);
      }

      .card-banner-pattern {
        position: absolute;
        inset: 0;
        opacity: 0.15;
        background-size: 20px 20px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.3) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.3) 1px, transparent 1px);
      }

      .card-banner-glow {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        filter: blur(35px);
        opacity: 0.45;
      }

      .card-icon {
        position: relative;
        font-size: 40px;
        z-index: 2;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
      }

      .card-top-badges {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 3;
      }

      .card-badge {
        font-size: 9px;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 5px;
        font-family: 'Fira Code', monospace;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }

      .card-difficulty {
        font-size: 10px;
        color: var(--text-muted);
        background: rgba(0, 0, 0, 0.55);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'Fira Code', monospace;
      }

      .card-body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .card-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 3px;
        color: #fff;
      }

      .card-subtitle {
        font-size: 11px;
        color: var(--text-muted);
        font-family: 'Fira Code', monospace;
        margin-bottom: 8px;
      }

      .card-desc {
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-secondary);
        margin-bottom: 12px;
        flex: 1;
      }

      .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 12px;
      }

      .tag-pill {
        font-size: 10px;
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        padding: 2px 7px;
        border-radius: 5px;
      }

      .card-controls {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
      }
      .control-key {
        font-family: 'Inter', sans-serif;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-weight: 600;
      }
      .control-action {
        color: var(--text-muted);
      }

      .card-footer {
        padding-top: 10px;
        border-top: 1px solid var(--border-color);
      }

      .btn-launch {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        min-height: 42px;
      }

      .project-card:hover .btn-launch,
      .project-card:active .btn-launch {
        background: var(--card-accent, var(--accent-cyan));
        color: #07090e;
        border-color: var(--card-accent, var(--accent-cyan));
        box-shadow: 0 0 14px var(--card-glow, rgba(0, 240, 255, 0.4));
      }

      .btn-launch.disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <!-- Background Canvas for Particles -->
    <canvas id="bg-canvas"></canvas>

    <!-- App Wrapper -->
    <div id="app-wrapper">
      <!-- Phaser 3 Canvas Container -->
      <div id="game-container"></div>
    </div>

    <!-- In-Game Floating Top Navigation Bar -->
    <div id="game-navbar">
      <div class="nav-left">
        <button class="btn-hub-return" id="btn-back-to-hub" title="프로젝트 허브로 돌아가기">
          <span>✕ 나가기</span>
        </button>
        <div class="nav-game-title">
          <span id="nav-game-icon">⚡</span>
          <span id="nav-game-name">Cyber Dash</span>
          <span id="nav-game-badge" class="nav-badge" style="background: rgba(0, 240, 255, 0.2); color: #00f0ff;">SANDBOX</span>
        </div>
      </div>
      <div class="nav-right">
        <button class="nav-icon-btn btn-sound-toggle" title="사운드 켜기/끄기">
          🔊
        </button>
        <button class="nav-icon-btn" id="btn-restart" title="재시작 (R)">
          🔄
        </button>
        <button class="nav-icon-btn" id="btn-fullscreen" title="전체화면 토글">
          ⛶
        </button>
      </div>
    </div>

    <!-- In-Game Bottom Quick Hint -->
    <div id="game-bottom-hint" style="opacity: 0;">
      <span id="hint-badge" class="nav-badge" style="background: #238636; color: white;">Controls</span>
      <span id="hint-text">터치 & 드래그 조작</span>
    </div>

    <!-- ================= HUB / LAUNCHER UI OVERLAY ================= -->
    <div id="hub-overlay">
      <!-- Header -->
      <header class="hub-header">
        <div class="brand">
          <div class="brand-icon">🎮</div>
          <div class="brand-title">
            <span>MINI 2D LAB</span>
            <span class="brand-version">MOBILE</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="nav-icon-btn btn-sound-toggle" title="사운드 켜기/끄기">
            🔊
          </button>
          <div class="stats-chip">
            <span class="stats-dot"></span>
            <span id="playable-count">14 Playable Games</span>
          </div>
          <button class="nav-icon-btn" id="hub-btn-fullscreen" title="전체화면 모드">
            ⛶
          </button>
        </div>
      </header>

      <!-- Hero Header -->
      <section class="hub-hero">
        <div class="hero-tag">📱 Mobile-First 2D Game Lab</div>
        <h1 class="hero-title">모바일 미니게임 연구소</h1>
        <p class="hero-desc">
          터치 제스처, 아날로그 조이스틱, 절단 물리, 진자 스윙, 리듬 탭, 물리 병합 등 게임 개발 영감을 주는 14종의 모바일 인터랙티브 미니게임입니다.
        </p>
      </section>

      <!-- Category Filter & Search -->
      <div class="hub-controls">
        <div class="category-pills" id="category-filters">
          <button class="category-pill active" data-category="all">✨ 전체 (All)</button>
          <button class="category-pill" data-category="arcade">🎯 아케이드 (Arcade)</button>
          <button class="category-pill" data-category="physics">🪐 물리 시뮬레이션 (Physics)</button>
          <button class="category-pill" data-category="rhythm">🎵 리듬 탭 (Rhythm)</button>
          <button class="category-pill" data-category="puzzle">🔮 물리 퍼즐 (Puzzle)</button>
          <button class="category-pill" data-category="sandbox">⚡ 조작 샌드박스 (Sandbox)</button>
        </div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="project-search" class="search-input" placeholder="미니게임명, 메커니즘 검색..." />
        </div>
      </div>

      <!-- Projects Grid -->
      <div class="projects-grid" id="projects-grid">
        <!-- Rendered dynamically by main.ts -->
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
